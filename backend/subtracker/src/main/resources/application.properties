spring.application.name=subtracker

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── PostgreSQL (env-var overrides used by Docker) ─────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/subtracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Jackson ────────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── JWT ------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-chars}
jwt.expiration=86400000

# ── Debug (remove after diagnosing 403) ───────────────────────────────────────
logging.level.org.springframework.security=DEBUG
