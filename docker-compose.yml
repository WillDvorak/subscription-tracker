services:
  db:
    image: postgres:16-alpine
    container_name: subtracker-db
    environment:
	POSTGRES_DB: ${DB_NAME}
      	POSTGRES_USER: ${DB_USERNAME}
      	POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/subtracker
      dockerfile: Dockerfile
    container_name: subtracker-api
    ports:
      - "8080:8080"
    environment:
	DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      	DB_USERNAME: ${DB_USERNAME}
      	DB_PASSWORD: ${DB_PASSWORD}
      	JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend/subscription-tracker
    container_name: subtracker-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
